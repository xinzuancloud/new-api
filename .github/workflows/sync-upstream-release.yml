name: Sync upstream releases

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional upstream release tag to process; blank processes all missing releases'
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-releases
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: QuantumNous/new-api
  UPSTREAM_REMOTE: https://github.com/QuantumNous/new-api.git

jobs:
  sync:
    name: Sync published upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out fork main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Merge missing upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          FORK_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_REMOTE" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REMOTE"
          git fetch --no-tags origin main
          git merge --ff-only origin/main

          if [[ -n "$REQUESTED_TAG" ]]; then
            release_tags=("$REQUESTED_TAG")
          else
            latest_tag="$(
              gh api --paginate "repos/${UPSTREAM_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | select(.draft == false and (.tag_name | startswith("v"))) | [(.published_at // .created_at), .tag_name] | @tsv' \
                | sort -k1,1 -k2,2 \
                | tail -n 1 \
                | cut -f2-
            )"
            release_tags=("$latest_tag")
          fi

          if [[ "${#release_tags[@]}" -eq 0 ]]; then
            echo 'No upstream releases were returned.'
            exit 0
          fi

          main_updated=false
          processed=0

          for upstream_tag in "${release_tags[@]}"; do
            if [[ ! "$upstream_tag" =~ ^v[0-9] ]]; then
              echo "Skipping non-version tag: $upstream_tag"
              continue
            fi

            upstream_tag_exists=false
            if git ls-remote --exit-code --refs origin "refs/tags/$upstream_tag" >/dev/null 2>&1; then
              upstream_tag_exists=true
            fi

            existing_fork_tag=''
            existing_fork_ref="$(git ls-remote --refs origin "refs/tags/${upstream_tag}-fork.*" | awk 'NR == 1 { print $1 }')"
            if [[ -n "$existing_fork_ref" ]]; then
              existing_fork_tag="${existing_fork_ref#refs/tags/}"
            fi

            if [[ "$upstream_tag_exists" == true && -n "$existing_fork_tag" ]]; then
              echo "Already synchronized: $upstream_tag -> $existing_fork_tag"
              continue
            fi

            echo "Processing upstream release: $upstream_tag"
            git fetch upstream "refs/tags/$upstream_tag:refs/tags/upstream/$upstream_tag"
            upstream_ref="refs/tags/upstream/$upstream_tag"
            upstream_sha="$(git rev-parse "${upstream_ref}^{commit}")"

            if git merge-base --is-ancestor "$upstream_sha" HEAD; then
              echo "Fork main already contains $upstream_tag ($upstream_sha)."
            else
              if ! git merge --no-ff --no-edit "$upstream_ref"; then
                git merge --abort || true
                echo "::error::Conflict while merging upstream release $upstream_tag into main"
                exit 1
              fi
            fi

            main_sha="$(git rev-parse HEAD)"
            remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{ print $1 }')"
            if [[ "$remote_main_sha" != "$main_sha" ]]; then
              git push origin 'HEAD:main'
              main_updated=true
            fi

            if [[ "$upstream_tag_exists" == false ]]; then
              git push origin "$upstream_ref:refs/tags/$upstream_tag"
            fi

            if [[ -z "$existing_fork_tag" ]]; then
              commit_stamp="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y%m%d.t%H%M%S)"
              short_sha="$(git rev-parse --short=12 HEAD)"
              existing_fork_tag="${upstream_tag}-fork.${commit_stamp}.g${short_sha}"
              if git ls-remote --exit-code --refs origin "refs/tags/$existing_fork_tag" >/dev/null 2>&1; then
                echo "Fork tag already exists: $existing_fork_tag"
              else
                git tag -a "$existing_fork_tag" HEAD -m "Fork release $existing_fork_tag based on upstream $upstream_tag"
                git push origin "refs/tags/$existing_fork_tag"
              fi
            fi

            for workflow in release.yml docker-build.yml electron-build.yml; do
              gh workflow run "$workflow" --repo "$FORK_REPOSITORY" --ref main --field "tag=$upstream_tag"
              gh workflow run "$workflow" --repo "$FORK_REPOSITORY" --ref main --field "tag=$existing_fork_tag"
            done

            processed=$((processed + 1))
          done

          if [[ "$main_updated" == true ]]; then
            gh workflow run ci.yml --repo "$FORK_REPOSITORY" --ref main
          fi

          echo "Processed $processed upstream release(s)."
