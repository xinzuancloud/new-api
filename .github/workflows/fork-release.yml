name: Release binaries (tag)
permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v1.0.0 or v1.0.0-rc.1-fork.20260906.gabc1234)'
        required: true
        type: string
      name:
        description: 'reason'
        required: false

run-name: Release binaries (tag) · ${{ inputs.tag }}

concurrency:
  group: fork-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - name: Determine Version
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo '::error::A version tag beginning with v and a digit is required'
            exit 1
          fi
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend (amd64)
        run: |
          go mod download
          MODULE_PATH="$(go list -m)"
          go build -ldflags "-s -w -X '${MODULE_PATH}/common.Version=$RELEASE_TAG' -extldflags '-static'" -o "new-api-$VERSION"
          if [[ "$(env -u VERSION "./new-api-$VERSION" --version | tr -d '\r')" != "$RELEASE_TAG" ]]; then
            echo '::error::Built binary version does not match requested tag'
            exit 1
          fi
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          MODULE_PATH="$(go list -m)"
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X '${MODULE_PATH}/common.Version=$RELEASE_TAG' -extldflags '-static'" -o "new-api-arm64-$VERSION"
      - name: Generate checksums
        run: sha256sum new-api-* > checksums-linux.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            new-api-*
            checksums-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - name: Determine Version
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo '::error::A version tag beginning with v and a digit is required'
            exit 1
          fi
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          MODULE_PATH="$(go list -m)"
          go build -ldflags "-X '${MODULE_PATH}/common.Version=$RELEASE_TAG'" -o "new-api-macos-$VERSION"
          if [[ "$(env -u VERSION "./new-api-macos-$VERSION" --version | tr -d '\r')" != "$RELEASE_TAG" ]]; then
            echo '::error::Built binary version does not match requested tag'
            exit 1
          fi
      - name: Generate checksums
        run: shasum -a 256 new-api-macos-* > checksums-macos.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            new-api-macos-*
            checksums-macos.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - name: Determine Version
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo '::error::A version tag beginning with v and a digit is required'
            exit 1
          fi
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          MODULE_PATH="$(go list -m)"
          go build -ldflags "-s -w -X '${MODULE_PATH}/common.Version=$RELEASE_TAG'" -o "new-api-$VERSION.exe"
          if [[ "$(env -u VERSION "./new-api-$VERSION.exe" --version | tr -d '\r')" != "$RELEASE_TAG" ]]; then
            echo '::error::Built binary version does not match requested tag'
            exit 1
          fi
      - name: Generate checksums
        run: sha256sum new-api-*.exe > checksums-windows.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            new-api-*.exe
            checksums-windows.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
