name: Publish Docker image (GHCR)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (for example v1.0.0 or v1.0.0-fork.20260906.t143000.gabc1234)'
        required: true
        type: string

jobs:
  prepare:
    name: Prepare Docker tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.version.outputs.image }}
      is_fork: ${{ steps.version.outputs.is_fork }}
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out requested tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve Docker tags
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::Tag '$TAG' is not a version tag"
            exit 1
          fi
          if ! git rev-parse "refs/tags/$TAG^{commit}" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist in the checked-out repository"
            exit 1
          fi

          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IS_FORK=false
          if [[ "$TAG" == *-fork.* ]]; then
            IS_FORK=true
          fi

          {
            echo "image=$IMAGE"
            echo "is_fork=$IS_FORK"
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG for $IMAGE (fork release: $IS_FORK)"

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out requested tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Write VERSION
        run: echo "${{ needs.prepare.outputs.tag }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}

      - name: Build & push single-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign architecture image
        run: cosign sign --yes "${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Output digest
        run: |
          {
            echo "### Docker Image Digest (${{ matrix.arch }})"
            echo '```'
            echo "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}"
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create multi-architecture manifests
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version manifest
        run: |
          set -Eeuo pipefail
          IMAGE="${{ needs.prepare.outputs.image }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"

      - name: Create fork latest manifest
        if: needs.prepare.outputs.is_fork == 'true'
        run: |
          set -Eeuo pipefail
          IMAGE="${{ needs.prepare.outputs.image }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e70d6ae9567deba6 # v4.1.2

      - name: Sign version manifest
        run: cosign sign --yes "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}"

      - name: Sign fork latest manifest
        if: needs.prepare.outputs.is_fork == 'true'
        run: cosign sign --yes "${{ needs.prepare.outputs.image }}:latest"

      - name: Manifest summary
        run: |
          {
            echo '### Multi-architecture Manifest'
            echo '```'
            docker buildx imagetools inspect "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}"
            if [[ "${{ needs.prepare.outputs.is_fork }}" == true ]]; then
              echo '---'
              docker buildx imagetools inspect "${{ needs.prepare.outputs.image }}:latest"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
